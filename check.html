<style>

@keyframes flash{50%{box-shadow:0 0 0 3px var(--amber)}}

.opt.wrong .let{background:var(--bad);color:#fff}

 border-radius:0 8px 8px 0;padding:7px 12px;color:#d8cfae;line-height:1.65;white-space:pre-line;font-size:13.5px}
.qcard.graded .expl{display:block}

<script>
'use strict';
/* ===PURE:BEGIN=== */
// —— 无 DOM 纯函数核心(node 单测:out/quiz_checkpage_dev/test_core.mjs
//    从本块提取后直接断言,页面与测试零拷贝) ——

function escHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// mulberry32 种子随机源:单测确定性用;页面走 Math.random
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ★Fisher-Yates:返回新数组、不改入参;搬的是元素对象本身,
// is_correct 跟着元素走。这是消费本数据包的头号正确性要求——
// 源数据正确答案恒在源序 options[0],不洗牌 = 永远命中第一项
function fisherYates(arr, rng){
  const rand = rng || Math.random;
  const out = arr.slice();
  for(let i = out.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    const t = out[i]; out[i] = out[j]; out[j] = t;
  }
  return out;
}

function shuffleOptions(options, rng){ return fisherYates(options, rng); }

// 判分:唯一事实来源是 is_correct 字段;chosenNo 用选项身份(源表 no),
// 与洗牌后的显示位置无关——绝不按位置判断
function gradeAnswer(options, chosenNo){
  const chosen = options.find(o => o.no === chosenNo) || null;
  const correct = options.find(o => o.is_correct === true) || null;
  return { chosen, correctNo: correct ? correct.no : null,
           ok: !!(chosen && correct && chosen.no === correct.no) };
}

// 洗牌记忆校验:持久化的 no 序列必须与该题选项重集一致
// (数据热更后选项集变化 → 旧记忆自动失效重洗)
function storedOrderValid(options, nos){
  if(!Array.isArray(nos) || nos.length !== options.length) return false;
  const a = options.map(o => o.no).slice().sort((x,y)=>x-y);
  const b = nos.slice().sort((x,y)=>x-y);
  return a.every((v,i) => v === b[i]);
}

// 按持久化顺序重排;顺序无效返回 null(调用方回退洗牌)
function orderOptionsBy(options, nos){
  if(!storedOrderValid(options, nos)) return null;
  const byNo = new Map(options.map(o => [o.no, o]));
  return nos.map(n => byNo.get(n));
}

// 该题本次展示顺序:有有效记忆用记忆(切走切回不重洗),否则现洗
function orderFor(q, storedNos, rng){
  return orderOptionsBy(q.options, storedNos) || shuffleOptions(q.options, rng);
}

// 游戏富文本 → 安全 HTML:
//  - <color=focus_light>/<color=warn_light> 内文高亮(金/红 mark),与游戏内
//    "关键词高亮提示"语义一致
//  - <link=…>/<u> 等其余标签剥壳留内文;孤立闭标签安全丢弃
//  - 文本节点逐段 HTML 转义;\n 原样保留(配合 CSS pre-line)
const RICH_HIGHLIGHT = { focus_light: 'kw', warn_light: 'kww' };
function richToHtml(raw){
  const parts = String(raw ?? '').split(/(<[^<>]*>)/);
  let out = '', open = 0;
  for(const p of parts){
    if(!p) continue;
    if(p[0] === '<' && p[p.length-1] === '>'){
      const m = p.match(/^<\s*(\/?)\s*([a-zA-Z][a-zA-Z0-9:_-]*)[^>]*>$/);
      if(!m){ out += escHtml(p); continue; }   // 形似标签解析不出 → 按纯文本转义
      const closing = m[1] === '/', tag = m[2].toLowerCase();
      if(!closing && tag === 'color'){
        const cm = p.match(/=\s*([a-zA-Z0-9_]+)/);
        const cls = cm && RICH_HIGHLIGHT[cm[1]];
        if(cls){ out += '<mark class="' + cls + '">'; open++; }
      }else if(closing && tag === 'color'){
        if(open > 0){ out += '</mark>'; open--; }
      }
      // 其余标签(link/u/…):开壳丢弃(内文保留)、闭壳丢弃
    }else{
      out += escHtml(p);
    }
  }
  while(open-- > 0) out += '</mark>';          // 未闭合兜底
  return out;
}

function richPlain(raw){ return String(raw ?? '').replace(/<[^<>]*>/g, ''); }

// 搜索索引:id + 双语题干(剥标签)+ 出题人
function questionHaystack(q){
  return [q.id, richPlain(q.question && q.question.zh), richPlain(q.question && q.question.en),
          (q.provider_name || '')].join(' ').toLowerCase();
}

// 主题池清单(当前 bank):[theme, count] 升序(数字感知,theme2 < theme10)
function themeCounts(questions){
  const m = new Map();
  for(const q of questions) m.set(q.theme, (m.get(q.theme) || 0) + 1);
  return [...m.entries()].sort((a,b) =>
    String(a[0]).localeCompare(String(b[0]), undefined, {numeric:true}));
}
/* ===PURE:END=== */

/* ============================== i18n ============================== */
const LANGS = {
zh: {
  docTitle:'HPMA 答题题库核对', appTitle:'答题题库核对',
  searchPh:'搜索题干关键词 / id / 出题人',
  allThemes:'全部主题池', reset:'重置做答',
  resetConfirm:'清空当前数据版本的做答记录与洗牌顺序记忆?',
  langBtn:'EN', qCount:n=>n+' 题',
  statLine:(a,b,c)=>'已答 '+a+'/'+b+' · 正确 '+c,
  shownLine:(s,t2)=>'显示 '+s+'/'+t2,
  bankNames:{history_of_magic:'魔法史', muggle_studies:'麻瓜研究'},
  ugc:'玩家出题', provider:'出题玩家',
  ncb:'关双语', ncbTip:'need_close_bilingual=1(游戏原字段:关闭中英双语显示)',
  dup:'共用题干',
  conflictWarn:'讲解原文与标答矛盾',
  conflictExplain:'注意:本题讲解原文与标答(option1)矛盾,官方数据疑似 bug,此处仍按运行时约定判 option1 正确。',
  explanation:'教授讲解',
  mSummary:'数据包清单(manifest.json + quiz.json 契约)',
  mSchema:'schema_version', mData:'data_version', mGen:'generated_at',
  mLocales:'locales', mDatasets:'datasets', mNotes:'notes(原样)',
  mBanks:'coverage.banks', mQuestions:'coverage.questions',
  mBilingual:'coverage.bilingual(应=总题数)', mConflicts:'coverage.answer_conflicts',
  mUgc:'coverage.ugc_questions', mDup:'coverage.duplicate_questions',
  mRestate:'coverage.teacher_restate_option1(答案约定健康度)',
  mCountCheck:'datasets[quiz].count vs 实际', mVersionCheck:'quiz.json vs manifest 版本',
  warnCountMismatch:(a,b)=>'实际 '+a+' 题 ≠ manifest '+b,
  warnVersionMismatch:(a,b)=>'不一致:quiz('+a+') vs manifest('+b+')',
  errTitle:'数据加载失败',
  errNoQuiz:'manifest.datasets 中不存在 id=="quiz" 的数据集',
  errHint:'check_quiz.html 是内置参考消费者:必须与 manifest.json / quiz.json 同目录,并通过 http 打开(例:在本目录跑 python -m http.server 后访问本页)。直接双击以 file:// 打开会被浏览器 CORS 拦截。',
  footer:'check_quiz.html — hpma-quizbank 内置参考消费者。契约:fetch(manifest.json) → datasets[id=quiz].file;源数据正确答案恒在源序 options[0],本页展示前已逐题 Fisher-Yates 洗牌并记忆顺序,is_correct 随选项字段走,绝不按位置判分。',
},
en: {
  docTitle:'HPMA Quiz Bank Check', appTitle:'Quiz Bank Check',
  searchPh:'Search question text / id / author',
  allThemes:'All theme pools', reset:'Reset answers',
  resetConfirm:'Clear all answered records and shuffle memory for this data version?',
  langBtn:'中文', qCount:n=>n+' q',
  statLine:(a,b,c)=>'Answered '+a+'/'+b+' · Correct '+c,
  shownLine:(s,t2)=>'Showing '+s+'/'+t2,
  bankNames:{history_of_magic:'History of Magic', muggle_studies:'Muggle Studies'},
  ugc:'UGC', provider:'Question author',
  ncb:'bi-off', ncbTip:'need_close_bilingual=1 (game field: bilingual subtitles off)',
  dup:'Shared stem',
  conflictWarn:'Explanation contradicts keyed answer',
  conflictExplain:'Note: the explanation text contradicts the keyed answer (option1) — likely an official data bug. Grading still follows the runtime convention (option1 correct).',
  explanation:"Professor's explanation",
  mSummary:'Bundle manifest (manifest.json + quiz.json contract)',
  mSchema:'schema_version', mData:'data_version', mGen:'generated_at',
  mLocales:'locales', mDatasets:'datasets', mNotes:'notes (verbatim)',
  mBanks:'coverage.banks', mQuestions:'coverage.questions',
  mBilingual:'coverage.bilingual (should = total)', mConflicts:'coverage.answer_conflicts',
  mUgc:'coverage.ugc_questions', mDup:'coverage.duplicate_questions',
  mRestate:'coverage.teacher_restate_option1 (answer-convention health)',
  mCountCheck:'datasets[quiz].count vs actual', mVersionCheck:'quiz.json vs manifest version',
  warnCountMismatch:(a,b)=>'actual '+a+' ≠ manifest '+b,
  warnVersionMismatch:(a,b)=>'mismatch: quiz('+a+') vs manifest('+b+')',
  errTitle:'Failed to load data',
  errNoQuiz:'No dataset with id=="quiz" in manifest.datasets',
  errHint:'check_quiz.html is the built-in reference consumer: it must sit next to manifest.json / quiz.json and be served over http (e.g. run python -m http.server in this directory). Opening via file:// is blocked by CORS.',
  footer:'check_quiz.html — built-in reference consumer of hpma-quizbank. Contract: fetch(manifest.json) → datasets[id=quiz].file. Source data always stores the correct answer at source order options[0]; this page Fisher-Yates-shuffles per question and remembers the order. Grading follows is_correct, never position.',
}};

/* ============================== 状态 ============================== */
const $ = s => document.querySelector(s);
let MAN = null, QUIZ = null;                  // manifest.json / quiz.json
let BANKS = [];                               // [{id, questions}]
let lang = 'zh', bank = null;
let themeFilter = 'all', query = '';
let SHUF = {}, ANS = {};                      // 洗牌记忆 / 做答记录,key='bank:id'
let LS = {lang:'', bank:'', shuf:'', ans:''};// localStorage 键(按 data_version 隔离)
const T = () => LANGS[lang];

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsRaw(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : v; }catch(e){ return d; } }
function lsSetRaw(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

async function getJson(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(url + ' → HTTP ' + r.status);
  return r.json();
}

/* ============================== 启动 ============================== */
// 契约:页面与 quiz.json / manifest.json 同目录;
// datasets 里 id=='quiz' 的 file 是唯一数据入口,文件名之外不做任何推断
async function boot(){
  try{
    MAN = await getJson('manifest.json');
    const ds = (MAN.datasets || []).find(d => d && d.id === 'quiz');
    if(!ds) throw new Error(LANGS.zh.errNoQuiz);
    QUIZ = await getJson(ds.file);
    const DV = QUIZ.data_version;
    LS = { lang:'hpma_quiz_check.lang',
           bank:'hpma_quiz_check.d'+DV+'.bank',
           shuf:'hpma_quiz_check.d'+DV+'.shuffle',
           ans:'hpma_quiz_check.d'+DV+'.answers' };
    lang = lsRaw(LS.lang, 'zh') === 'en' ? 'en' : 'zh';
    SHUF = lsGet(LS.shuf, {}) || {};
    ANS  = lsGet(LS.ans, {}) || {};
    BANKS = Object.keys(QUIZ.banks).map(id =>
      ({ id, questions: QUIZ.banks[id].questions || [] }));
    bank = lsRaw(LS.bank, null);
    if(!BANKS.some(b => b.id === bank)) bank = BANKS[0].id;
    initUI();
  }catch(e){
    $('#bar').style.display = 'none';
    $('#manifestBox').style.display = 'none';
    $('#foot').style.display = 'none';
    $('#errBody').innerHTML = '<b>' + escHtml(LANGS.zh.errTitle) + '</b><br>'
      + escHtml(e && e.message || e) + '<br><br>' + escHtml(LANGS.zh.errHint);
    $('#err').style.display = 'block';
  }
}

/* ============================== UI 构建 ============================== */
function buildTabs(){
  $('#tabs').innerHTML = BANKS.map(b =>
    '<button class="tab" data-bank="' + escHtml(b.id) + '"></button>').join('');
  document.querySelectorAll('.tab').forEach(el => el.onclick = () => {
    if(el.dataset.bank === bank) return;
    bank = el.dataset.bank; lsSetRaw(LS.bank, bank);
    themeFilter = 'all';
    fillThemes(); render();
  });
}

function initUI(){
  buildTabs();
  $('#langBtn').onclick = () => {
    lang = lang === 'zh' ? 'en' : 'zh'; lsSetRaw(LS.lang, lang); applyLang();
  };
  $('#resetBtn').onclick = () => {
    if(!confirm(T().resetConfirm)) return;
    SHUF = {}; ANS = {}; lsSet(LS.shuf, SHUF); lsSet(LS.ans, ANS);
    render();
  };
  $('#themeSel').onchange = e => { themeFilter = e.target.value; render(); };
  $('#q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };
  // 题卡判分 / 清单跳转:事件委托
  const onJump = e => { const jt = e.target.closest('[data-jump]'); if(jt) jumpTo(jt.dataset.jump); };
  $('#list').addEventListener('click', e => {
    const opt = e.target.closest('.opt');
    if(opt && !opt.disabled) answer(opt);
    onJump(e);
  });
  $('#mBody').addEventListener('click', onJump);
  applyLang();
}

function applyLang(){
  const t = T();
  document.documentElement.lang = lang;
  document.title = t.docTitle;
  $('#bar h1').textContent = t.appTitle;
  $('#q').placeholder = t.searchPh;
  $('#langBtn').textContent = t.langBtn;
  $('#resetBtn').textContent = t.reset;
  $('#mSummary').textContent = t.mSummary;
  $('#foot').textContent = t.footer;
  for(const b of BANKS){
    const el = document.querySelector('.tab[data-bank="' + b.id + '"]');
    if(el) el.textContent = (t.bankNames[b.id] || b.id) + ' · ' + t.qCount(b.questions.length);
  }
  renderManifest();
  fillThemes();
  render();
}

function fillThemes(){
  const b = BANKS.find(x => x.id === bank);
  const sel = $('#themeSel');
  let h = '<option value="all">' + escHtml(T().allThemes) + '</option>';
  for(const [th, n] of themeCounts(b.questions))
    h += '<option value="' + escHtml(th) + '">' + escHtml(th) + ' (' + n + ')</option>';
  sel.innerHTML = h;
  sel.value = [...sel.options].some(o => o.value === themeFilter) ? themeFilter : 'all';
  themeFilter = sel.value;
}

/* ============================== 渲染 ============================== */
function orderKey(bankId, qid){ return bankId + ':' + qid; }

function filteredQuestions(){
  const b = BANKS.find(x => x.id === bank);
  return b.questions.filter(q =>
    (themeFilter === 'all' || q.theme === themeFilter) &&
    (!query || questionHaystack(q).includes(query)));
}

function optionBtnHTML(o, i, state){
  const cls = state ? 'opt ' + state : 'opt';
  const txt = (o.text && (o.text[lang] ?? o.text.zh)) ?? '';
  return '<button class="' + cls + '" data-no="' + o.no + '"' + (state ? ' disabled' : '') +
    '><span class="let">' + String.fromCharCode(65 + i) + '</span>' +
    '<span class="txt">' + richToHtml(txt) + '</span></button>';
}

function cardHTML(b, q, newShuf){
  const t = T(), key = orderKey(b.id, q.id);
  // ★洗牌:有有效记忆用记忆(切走切回不重洗),否则 Fisher-Yates 并记住
  let order = orderOptionsBy(q.options, SHUF[key]);
  if(!order){ order = shuffleOptions(q.options); newShuf[key] = order.map(o => o.no); }
  const chosenNo = ANS[key];
  const answered = chosenNo != null;
  const g = answered ? gradeAnswer(q.options, chosenNo) : null;
  const conflict = q.answer_conflict === true;
  let badges = '';
  if(q.provider_name)
    badges += '<span class="badge ugc" title="' + escHtml(t.provider) + '">'
      + escHtml('UGC·' + q.provider_name) + '</span>';
  if(q.need_close_bilingual === 1)
    badges += '<span class="badge" title="' + escHtml(t.ncbTip) + '">' + escHtml(t.ncb) + '</span>';
  if((q.duplicate_of || []).length)
    badges += '<span class="badge">' + escHtml(t.dup + ' ' + q.duplicate_of.map(id => '#' + id).join(' ')) + '</span>';
  if(conflict)
    badges += '<span class="badge conflict">⚠ ' + escHtml(t.conflictWarn) + '</span>';
  const opts = order.map((o, i) => {
    let st = null;
    if(answered){
      if(o.no === g.correctNo) st = 'correct';
      else if(o.no === chosenNo) st = 'wrong';
      else st = 'dim';
    }
    return optionBtnHTML(o, i, st);
  }).join('');
  const qtext = richToHtml((q.question && (q.question[lang] ?? q.question.zh)) ?? '');
  const etext = richToHtml((q.explanation && (q.explanation[lang] ?? q.explanation.zh)) ?? '');
  const expl = '<div class="expl"><b>' + escHtml(t.explanation) + '</b>'
    + (conflict ? ' <span class="warninline">⚠ ' + escHtml(t.conflictExplain) + '</span>' : '')
    + '<br>' + etext + '</div>';
  return '<article class="qcard' + (answered ? ' graded' : '') + (conflict ? ' conflictc' : '') +
    '" id="qc-' + escHtml(b.id) + '-' + q.id + '" data-bank="' + escHtml(b.id) + '" data-qid="' + q.id + '">' +
    '<div class="qhead"><span class="qid">#' + q.id + '</span>' +
    '<span class="badge">' + escHtml(q.theme) + '</span>' + badges + '</div>' +
    '<div class="qtext">' + qtext + '</div>' +
    '<div class="opts">' + opts + '</div>' + expl + '</article>';
}

function render(){
  if(!BANKS.length) return;
  const b = BANKS.find(x => x.id === bank);
  const list = filteredQuestions();
  const newShuf = {};
  $('#list').innerHTML = list.map(q => cardHTML(b, q, newShuf)).join('');
  if(Object.keys(newShuf).length){ Object.assign(SHUF, newShuf); lsSet(LS.shuf, SHUF); }
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.dataset.bank === bank));
  $('#shown').textContent = T().shownLine(list.length, b.questions.length);
  updateStats();
}

function updateStats(){
  const b = BANKS.find(x => x.id === bank);
  let a = 0, c = 0;
  for(const q of b.questions){
    const ch = ANS[orderKey(b.id, q.id)];
    if(ch != null){ a++; if(gradeAnswer(q.options, ch).ok) c++; }
  }
  $('#stat').textContent = T().statLine(a, b.questions.length, c);
}

// 点选项立即判分:正确绿 / 错误红 + 标出正解,展示讲解
function answer(btn){
  const card = btn.closest('.qcard');
  const bId = card.dataset.bank, qid = +card.dataset.qid;
  const key = orderKey(bId, qid);
  if(ANS[key] != null) return;
  const b = BANKS.find(x => x.id === bId);
  const q = b.questions.find(x => x.id === qid);
  const chosenNo = +btn.dataset.no;
  const g = gradeAnswer(q.options, chosenNo);
  if(g.correctNo == null) return;            // 数据异常兜底:无标答不记录
  ANS[key] = chosenNo; lsSet(LS.ans, ANS);
  card.classList.add('graded');
  card.querySelectorAll('.opt').forEach(el => {
    const no = +el.dataset.no;
    el.disabled = true;
    if(no === g.correctNo) el.classList.add('correct');
    else if(no === chosenNo) el.classList.add('wrong');
    else el.classList.add('dim');
  });
  updateStats();
}

// manifest 面板 / answer_conflicts 跳转
function jumpTo(jk){
  const i = jk.indexOf(':');
  const bId = jk.slice(0, i), qid = +jk.slice(i + 1);
  const b = BANKS.find(x => x.id === bId);
  if(!b || !b.questions.some(q => q.id === qid)) return;
  bank = bId; lsSetRaw(LS.bank, bank);
  themeFilter = 'all'; query = ''; $('#q').value = '';
  fillThemes(); render();
  const el = document.getElementById('qc-' + bId + '-' + qid);
  if(el){
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
}

/* ============================== manifest 面板 ============================== */
function renderManifest(){
  if(!MAN) return;
  const t = T(), m = MAN, cov = m.coverage || {};
  const row = (k, v, warn) =>
    '<tr><td class="k">' + escHtml(k) + '</td><td' + (warn ? ' class="warn"' : '') + '>' + v + '</td></tr>';
  const rows = [];
  rows.push(row(t.mSchema, escHtml(m.schema_version)));
  rows.push(row(t.mData, escHtml(m.data_version)));
  rows.push(row(t.mGen, escHtml(m.generated_at)));
  rows.push(row(t.mLocales, escHtml((m.locales || []).join(', '))));
  (m.datasets || []).forEach(d =>
    rows.push(row(t.mDatasets + '[' + d.id + ']', escHtml(d.file) + ' · ' + escHtml(d.count))));
  const total = BANKS.reduce((s, b) => s + b.questions.length, 0);
  if(QUIZ){
    const cnt = (m.datasets || []).find(d => d.id === 'quiz');
    if(cnt && cnt.count !== total)
      rows.push(row(t.mCountCheck, escHtml(t.warnCountMismatch(total, cnt.count)), true));
    if(QUIZ.schema_version !== m.schema_version || QUIZ.data_version !== m.data_version)
      rows.push(row(t.mVersionCheck, escHtml(t.warnVersionMismatch(
        QUIZ.schema_version + '/' + QUIZ.data_version, m.schema_version + '/' + m.data_version)), true));
  }
  rows.push(row(t.mBanks, escHtml(cov.banks)));
  for(const [bk, n] of Object.entries(cov.questions || {}))
    rows.push(row(t.mQuestions + '.' + bk, escHtml(n)));
  if(cov.bilingual != null)
    rows.push(row(t.mBilingual, escHtml(cov.bilingual) + (cov.bilingual === total ? ' ✓' : ' ⚠')));
  (cov.answer_conflicts || []).forEach(c =>
    rows.push(row(t.mConflicts, '<button class="jt" data-jump="' + escHtml(c) + '">' + escHtml(c) + '</button>')));
  rows.push(row(t.mUgc, escHtml(cov.ugc_questions)));
  rows.push(row(t.mDup, escHtml(cov.duplicate_questions)));
  if(cov.teacher_restate_option1){
    const parts = Object.entries(cov.teacher_restate_option1).map(([bk, n]) => {
      const tot = (cov.questions || {})[bk];
      return escHtml(bk) + ' ' + escHtml(n) +
        (tot ? ' / ' + escHtml(tot) + '(' + Math.round(100 * n / tot) + '%)' : '');
    });
    rows.push(row(t.mRestate, parts.join('<br>')));
  }
  const notes = (m.notes || []).map(n => '<li>' + escHtml(n) + '</li>').join('');
  $('#mBody').innerHTML = '<table>' + rows.join('') + '</table>' +
    '<div><span class="k">' + escHtml(t.mNotes) + '</span><ul>' + notes + '</ul></div>';
}

boot();
</script></body></html>
